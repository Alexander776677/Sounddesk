name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: pnpm install

      - name: Fix Expo Dependencies
        working-directory: artifacts/sounddeck
        run: pnpm exec expo install --fix --pnpm
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1

      - name: Generate Android Project
        working-directory: artifacts/sounddeck
        run: pnpm exec expo prebuild --platform android --clean --no-install
        env:
          CI: 1
          EXPO_NO_TELEMETRY: 1
          EXPO_NO_GIT_STATUS: 1

      - name: Install Updated Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Make Gradle executable
        working-directory: artifacts/sounddeck
        run: chmod +x android/gradlew

      - name: Build APK
        working-directory: artifacts/sounddeck/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoundDeck-APK
          path: artifacts/sounddeck/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
